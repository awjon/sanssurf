<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SansSurf</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #001228;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas-container {
      position: relative;
      width: 100dvw;
      height: 100dvh;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
    #gpu-canvas { z-index: 1; }
    #ui-canvas  { z-index: 10; }
    #no-webgpu {
      display: none;
      position: fixed; inset: 0;
      background: #001228;
      color: #FFD700;
      font-family: 'Courier New', monospace;
      font-size: clamp(1rem, 3vw, 1.5rem);
      text-align: center;
      padding: 2rem;
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    #no-webgpu.visible { display: flex; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gpu-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>
  </div>
  <div id="no-webgpu">
    <p>&#127940; WebGPU Not Supported</p>
    <p style="color:#fff;font-size:0.85em">Please use Chrome 121+ on Android<br>or Safari 17.4+ on iOS</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
